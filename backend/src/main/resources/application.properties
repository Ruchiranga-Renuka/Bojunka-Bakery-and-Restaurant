spring.application.name=backend
server.port=8081

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/bojunka

# JWT Secret (min 32 characters for HS256)
jwt.secret=change_this_secret_change_this_secret_change_this_secret
jwt.expiration=28800000

# Default admin account (created/reset on every startup)
bojunka.admin.username=admin
bojunka.admin.password=admin123

# SMS thank-you message (sent after receipt is printed)
bojunka.sms.enabled=true
bojunka.sms.provider=console
bojunka.sms.thank-you-message=Thank you! Come again to Bojunka Bakery and Restaurant.
# For real SMS, set provider=twilio and add Twilio credentials:
# bojunka.sms.provider=twilio
# bojunka.sms.twilio-account-sid=your_account_sid
# bojunka.sms.twilio-auth-token=your_auth_token
# bojunka.sms.twilio-from-number=+1234567890
bojunka.sms.twilio-account-sid=
bojunka.sms.twilio-auth-token=
bojunka.sms.twilio-from-number=
